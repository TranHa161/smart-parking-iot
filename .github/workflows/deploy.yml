name: Deploy to EC2

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:        # cho phép bấm chạy tay trên tab Actions

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Chỉ chạy khi PR thực sự được MERGE (không chạy khi PR bị đóng mà không merge)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Cấu hình SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: SSH vào EC2 và deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          APP_DIR: ${{ secrets.EC2_APP_DIR || '/home/ubuntu/smart-parking' }}
        run: |
          ssh -i ~/.ssh/id_deploy \
              -o ServerAliveInterval=30 -o ConnectTimeout=20 \
              "${EC2_USER}@${EC2_HOST}" \
              "cd '${APP_DIR}' && ./scripts/deploy.sh"
